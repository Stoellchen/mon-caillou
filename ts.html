<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>SYSTEM READY</title>
    
    <link href="https://fonts.googleapis.com/css?family=Orbitron" rel="stylesheet">
    <link href="https://maxcdn.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.3.1.js"></script>

    <style>
        /* CSS direkt in der Seite für "All-in-One" Lösung */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #0e0e0e;
            font-family: 'Orbitron', sans-serif;
            color: #fff;
            overflow: hidden;
        }

        .wrapper {
            width: 100%;
        }

        header nav {
            width: 100%;
            height: 60px;
            background: rgba(0, 0, 0, 0.8);
            position: fixed;
            top: 0;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            z-index: 1000;
        }

        .menu ul {
            list-style: none;
            display: flex;
            margin: 0;
            padding-right: 20px;
        }

        .menu ul li a {
            color: #fff;
            text-decoration: none;
            padding: 0 15px;
            font-size: 14px;
            transition: color 0.3s;
        }

        .menu ul li a:hover {
            color: #00ffcc;
        }

        .content {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            position: relative;
        }

        .random {
            font-size: 80px;
            font-weight: bold;
            letter-spacing: 10px;
            color: #00ffcc;
            text-shadow: 0 0 20px #00ffcc;
        }

        .nbr {
            opacity: 0.8;
        }

        /* Mobile Menu */
        .menu-icon {
            display: none;
            cursor: pointer;
            padding-right: 20px;
        }

        @media (max-width: 600px) {
            .menu-icon { display: block; }
            .menu { display: none; }
            .random { font-size: 40px; }
        }
    </style>

<style>


#bg{
  position:fixed;
  inset:0;
  background-color:#000;
  background-size:cover;
  background-position:center center;
  background-repeat:no-repeat;
  filter:grayscale(1) contrast(1.05) brightness(0.42);
  transform:scale(1.03);
  transition:opacity 1.4s ease;
  opacity:1;
  z-index:0;
}

#bg::after{
  content:"";
  position:absolute;
  inset:0;
  background:
    rgba(0,0,0,0.42),
    radial-gradient(circle at center, rgba(255,255,255,0.04), rgba(0,0,0,0.32) 55%, rgba(0,0,0,0.62)),
    repeating-linear-gradient(
      to bottom,
      rgba(255,255,255,0.018) 0px,
      rgba(255,255,255,0.018) 1px,
      rgba(0,0,0,0) 2px,
      rgba(0,0,0,0) 4px
    );
  pointer-events:none;
}

canvas{
  position:fixed;
  inset:0;
  opacity: 0.4;
  z-index:1;
}

#ui{
  position:fixed;
  top:20px;
  left:20px;
  color:#aaa;
  letter-spacing:.15em;
  font-size:12px;
  z-index:10;
  pointer-events:none;
}

#bg-wrap{
  position:fixed;
  inset:0;
  z-index:0;
  overflow:hidden;
}

.bg-layer{
  position:absolute;
  inset:0;
  background-color:#000;
  background-size:cover;
  background-position:center center;
  background-repeat:no-repeat;
  filter:grayscale(1) contrast(1.05) brightness(0.42);
  transform:scale(1.03);
  opacity:0;
  transition:opacity 1.8s ease;
}

#bg-wrap::after{
  content:"";
  position:absolute;
  inset:0;
  background:
    rgba(0,0,0,0.42),
    radial-gradient(circle at center, rgba(255,255,255,0.04), rgba(0,0,0,0.32) 55%, rgba(0,0,0,0.62)),
    repeating-linear-gradient(
      to bottom,
      rgba(255,255,255,0.018) 0px,
      rgba(255,255,255,0.018) 1px,
      rgba(0,0,0,0) 2px,
      rgba(0,0,0,0) 4px
    );
  pointer-events:none;
}

</style>
<script src="js/backgrounds.js"></script>
</head>
<body>
    <div class="content">
        <div class="random">
            <span class="nbr ltr">0</span>
            <span class="nbr ltr">0</span>
            <span class="nbr ltr">0</span>
            <span class="nbr ltr">0</span>
            <span class="nbr ltr">0</span>
            <span class="nbr ltr">0</span>
            <span class="nbr ltr">0</span>
            <span class="nbr ltr">0</span>
            <span class="nbr ltr">0</span>
        </div>
    </div>

<div id="bg-wrap">
  <div class="bg-layer" id="bgA"></div>
  <div class="bg-layer" id="bgB"></div>
</div>


    <script type="text/javascript">
    $(document).ready(function() {
        var $randomnbr = $('.nbr');
        var $timer = 15;
        var $data = 0;
        var index;
        var change;
        // Hier wurde der Name angepasst
        var letters = ["T", "H", "O", "M", "A", "S", "&nbsp;", "S", "."];

        $randomnbr.each(function() {
            change = Math.round(Math.random() * 500);
            $(this).attr('data-change', change);
        });

        function random() {
            return Math.round(Math.random() * 9);
        };

        function select() {
            return Math.round(Math.random() * $randomnbr.length + 1);
        };

        function value() {
            $('.nbr:nth-child(' + select() + ')').html('' + random() + '');
            $('.nbr:nth-child(' + select() + ')').attr('data-number', $data);
            $data++;

            $randomnbr.each(function() {
                if (parseInt($(this).attr('data-number')) > parseInt($(this).attr('data-change'))) {
                    index = $('.ltr').index(this);
                    $(this).html(letters[index]);
                    $(this).removeClass('nbr');
                }
            });
        };

        var $it = setInterval(value, $timer);

        // Menu-toggle
        $(".menu-icon").on("click", function() {
            $(".menu").fadeToggle();
        });
    });
    </script>
</body>
</html>
